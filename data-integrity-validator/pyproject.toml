[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-integrity-validator"
version = "1.0.0"
description = "A dependency-free Python toolkit for detecting hidden errors in migrated CSV data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
data-integrity-validator = "data_integrity_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
